<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>G1 Grasping Research Console</title>
  <style>
    body { margin: 0; padding: 16px; color: #eee; background: #101418; font: 15px system-ui; }
    main { max-width: 1200px; margin: auto; }
    header, section { margin-bottom: 12px; padding: 12px; border: 1px solid #34404a; border-radius: 8px; background: #182027; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .views { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    img { display: block; width: 100%; min-height: 220px; object-fit: contain; background: #000; }
    pre { min-height: 10em; overflow: auto; white-space: pre-wrap; }
    .ok { color: #5ee0a0; }
    .bad { color: #ff7070; }
    @media (max-width: 760px) { .views { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>G1 Grasping Research Console</h1>
    <span id="status">Connecting…</span>
  </header>
  <section class="views">
    <div><h2>YOLO RGB</h2><img src="/stream.mjpg" alt="Live annotated RGB"></div>
    <div><h2>Depth</h2><img id="depth" src="/depth.jpg" alt="Latest depth"></div>
  </section>
  <section>
    <h2>Realtime interception state</h2>
    <pre id="state">Waiting for health and tracking data…</pre>
  </section>
</main>
<script>
  const statusNode = document.querySelector("#status");
  const stateNode = document.querySelector("#state");
  async function refresh() {
    try {
      const [health, tracking] = await Promise.all([
        fetch("/health", {cache: "no-store"}).then(r => r.json()),
        fetch("/arm-tracking", {cache: "no-store"}).then(r => r.json())
      ]);
      statusNode.textContent = health.ok ? "Pipeline healthy" : "Pipeline fault";
      statusNode.className = health.ok ? "ok" : "bad";
      stateNode.textContent = JSON.stringify({
        camera_fps: health.fps,
        yolo_fps: health.yolo_fps,
        inference: health.inference_status,
        tracking
      }, null, 2);
      document.querySelector("#depth").src = `/depth.jpg?t=${Date.now()}`;
    } catch (error) {
      statusNode.textContent = `Disconnected: ${error.message}`;
      statusNode.className = "bad";
    }
  }
  refresh();
  setInterval(refresh, 500);
</script>
</body>
</html>
