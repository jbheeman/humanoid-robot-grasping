seed: 42
trackers:
  - jsonl
wandb_entity: local
wandb_project: g1_plush_touch
is_debug: false
framework:
  name: QwenFM
  framework_py: unifolm_vla
  qwenvl:
    base_vlm: /home/aarav/Documents/g1-bunny-vla-workspace/models/pretrained/UnifoLM-VLM-Base
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    model_type: qwen2_5_vl
  action_model:
    input_embedding_dim: 1536
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 23
    state_dim: 23
    future_action_window_size: 24
    action_horizon: 25
    past_action_window_size: 0
    repeated_diffusion_steps: 4
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      attention_head_dim: 48
      num_attention_heads: 32
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
    use_relative_action: false
datasets:
  vla_data:
    data_root_dir: /home/aarav/Documents/g1-bunny-vla-workspace/datasets/plush_touch_rlds_v1
    data_mix: g1_plush_touch_mixed
    per_device_batch_size: 1
    load_all_data_for_training: true
    image_size: [224, 224]
    window_size: 1
    observation_stride: 1
trainer:
  epochs: 100
  max_train_steps: 10000
  num_warmup_steps: 200
  save_interval: 500
  eval_interval: 500
  pretrained_checkpoint: /home/aarav/Documents/g1-bunny-vla-workspace/models/pretrained/UnifoLM-VLA-Base/checkpoints/pytorch_model.pt
  action_checkpoint: null
  reload_modules: null
  freeze_modules: qwen_vl_interface
  learning_rate:
    base: 0.0001
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 0.000005
  loss_scale:
    vla: 1.0
    vlm: 0.0
  repeated_diffusion_steps: 1
  max_grad_norm: 1.0
  warmup_ratio: 0.02
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 0.00000001
    weight_decay: 0.00000001
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: false
  enable_mixed_precision_training: true
  shuffle_buffer_size: 1000
  use_wrist_image: false
  use_proprio: true
  action_queries: 0
run_root_dir: /home/aarav/Documents/g1-bunny-vla-workspace/runs/unifolm_plush_touch
run_id: replace-me
